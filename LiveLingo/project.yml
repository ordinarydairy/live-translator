name: LiveLingo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  LiveLingo:
    type: application
    platform: iOS
    sources:
      - path: LiveLingo
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiveLingo
        INFOPLIST_FILE: LiveLingo/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveLingo/LiveLingo.entitlements
    dependencies:
      - target: BroadcastUploadExtension
  BroadcastUploadExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastUploadExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiveLingo.BroadcastUpload
        INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastUploadExtension/BroadcastUploadExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

